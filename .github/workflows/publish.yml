name: publish

# Runs when a GitHub release is published. Uses npm Trusted Publishing (OIDC):
# no token is stored anywhere. The package must list this repository and this
# workflow file as a trusted publisher on npmjs.com (package Settings).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --access public
